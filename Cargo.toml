[package]
name = "signet"
version = "0.1.0"
edition = "2024"
description = "Signet: Rust implementation of BLINCS (BLINCS-128-7x5), stateless hash-based post-quantum signatures on BLAKE3."
repository = "https://github.com/jasonhadler25/blincs"
license = "MIT OR Apache-2.0 OR TGPPL-1.0" # OR BOSL-1.0, see LICENSE-BOSL.txt
readme = "README.md"
include = [
    "/src",
    "/tests",
    "/reference",
    "/test_vectors",
    "/tools",
    "/SPEC.md",
    "/DESIGN.md",
    "/BENCHMARKS.md",
    "/CONTRIBUTING.md",
    "/README.md",
    "/QUALITY.md",
    "/SECURITY.md",
    "/LICENSE-*",
]

[dependencies]
blake3-servil-core = "=0.11.0"
getrandom = "=0.4.3"

# Tests run at release speed with debug assertions and overflow checks on.
[profile.test]
opt-level = 3
codegen-units = 16
incremental = false
debug = false
debug-assertions = true
overflow-checks = true

# Mutation testing builds what users run: a mutant caught only by a debug
# assertion or overflow check would escape a release build.
[profile.mutants]
inherits = "release"
incremental = true

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unreachable_patterns = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
