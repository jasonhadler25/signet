[package]
name = "signet-verify"
version = "0.1.0"
edition = "2024"
description = "Standalone #![no_std], zero-alloc, zero-table verifier for BLINCS (BLINCS-48-X) signatures."
repository = "https://github.com/jasonhadler25/signet"
license = "MIT OR Apache-2.0 OR TGPPL-1.0" # OR BOSL-1.0, see LICENSE-BOSL.txt

[dependencies]
blake3 = { version = "=1.8.7", default-features = false, features = ["pure"] }
constant_time_eq = { version = "=0.4.2", default-features = false }

[lints]
workspace = true
